name: Release

# Publishes a GitHub Release when a version tag is pushed:
#   git tag -a v1.2.0 -m "v1.2.0" && git push origin v1.2.0
# CI runs in full first; nothing is published unless every check passes. The
# release carries the installable package, the four Leafia kit sizes and SHA256SUMS, all
# built from exactly the tagged commit.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish release
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the release; the only job that can write

    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # tags and history, so the package's BUILD stamp names the version

      - name: Tag must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "$GITHUB_REF_NAME is not on main; releases are only made from main"; exit 1; }

      - name: Tag must match the package version
        run: |
          v=$(sed -n 's/^package-version=//p' packages/wireless-carplay-aa/NEMESIS.data | tr -d '"')
          [ "$GITHUB_REF_NAME" = "v$v" ] || {
            echo "tag $GITHUB_REF_NAME does not match package-version $v in packages/wireless-carplay-aa/NEMESIS.data"; exit 1; }

      - name: Build the package and the kit
        run: |
          mkdir -p release
          ./tools/build-package.sh "release/HMG_Leafia_Plus_Wireless_CarPlay_AA-$GITHUB_REF_NAME.zip"
          for lv in quick standard port full; do
            n=leafia-kit-$lv; [ $lv = standard ] && n=leafia-kit
            ./tools/build-kit.sh $lv "release/$n-$GITHUB_REF_NAME.zip"
          done
          unzip -p "release/HMG_Leafia_Plus_Wireless_CarPlay_AA-$GITHUB_REF_NAME.zip" packages/wireless.carplay.aa.zip \
            | python3 -c "import io,sys,zipfile; print('package BUILD:', zipfile.ZipFile(io.BytesIO(sys.stdin.buffer.read())).read('BUILD').decode().strip())"
          (cd release && sha256sum -- *.zip > SHA256SUMS)
          cat release/SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## Install

          1. Install [NEMESIS](https://github.com/xwtk/hmg_nemesis) 1.15 or newer on the head unit (1.16 or newer recommended). Coming from the original Leafia (v1.0.5 or older)? Uninstall it in NEMESIS Manager and restart first.
          2. Unzip **HMG_Leafia_Plus_Wireless_CarPlay_AA-$GITHUB_REF_NAME.zip** onto the root of an empty exFAT or FAT32 USB drive.
          3. Car on, plug in the drive and confirm the install. It takes a few minutes. When the head unit restarts, remove the drive: leaving it in can stop CarPlay or Android Auto connecting the first time.

          See **Known quirks** in the README if something doesn't connect at first.

          Check your car first on the [compatibility page](https://zpoon.github.io/HMG-Leafia-Plus/). Something wrong? Run **leafia-kit-$GITHUB_REF_NAME.zip** and open an issue with the problem form. (Other kit sizes: **quick** to check a car, **port** to add a new car, **full** for every crash record.) Uninstall any time from NEMESIS Manager; every file goes back to stock.

          Verify downloads with \`sha256sum -c SHA256SUMS\`.
          EOF
          # A release made in the web page (which also makes the tag) already exists:
          # attach the files to it and add the install notes under its own text, once.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            gh release view "$GITHUB_REF_NAME" --json body --jq .body > body.md
            if ! grep -q 'sha256sum -c SHA256SUMS' body.md; then
              { cat body.md; echo; cat notes.md; } > full.md
              gh release edit "$GITHUB_REF_NAME" --notes-file full.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag --title "HMG Leafia Plus $GITHUB_REF_NAME" \
              --notes-file notes.md --generate-notes
          fi
