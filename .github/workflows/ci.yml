name: CI

on:
  pull_request:
    branches: [main, 'release-*']
  push:
    branches: [main]
  # the release workflow runs all of CI first
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to full commit IDs (tags can be moved); the comment says which
# release that is. Build artifacts are only uploaded for pushes to main, so nothing
# built from a pull request's code is published as a download.
#
# Each check runs only when something it covers changed (see the "changes" job);
# a docs-only change runs no checks. Releases, changes to this workflow and pushes
# whose previous commit is unknown run everything.

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      lpatch: ${{ steps.f.outputs.lpatch }}
      ev6aac: ${{ steps.f.outputs.ev6aac }}
      kits: ${{ steps.f.outputs.kits }}
      package: ${{ steps.f.outputs.package }}
      ev: ${{ steps.f.outputs.ev }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide which checks to run
        id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          all=false
          case "$GITHUB_REF" in refs/tags/*) all=true ;; esac
          if [ $all = false ]; then
            case "$EVENT" in
              pull_request) range="$BASE...$GITHUB_SHA" ;;
              push)
                if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                  range="$BEFORE..$GITHUB_SHA"
                else
                  all=true
                fi ;;
              *) all=true ;;
            esac
          fi
          : > changed.txt
          [ $all = false ] && git diff --name-only "$range" > changed.txt
          echo "run everything: $all"; echo "changed files:"; sed 's/^/  /' changed.txt
          always='^(\.github/workflows/|tools/requirements\.txt)'
          hit() { [ $all = true ] || grep -q -E "$always|$1" changed.txt; }
          out() { if hit "$2"; then v=true; else v=false; fi; echo "$1=$v" | tee -a "$GITHUB_OUTPUT"; }
          out lpatch  '^(tools/lpatch/|recipes/|tools/mkdelta\.py|tools/mkrecipe\.py)'
          out ev6aac  '^(src/ev6aac/|packages/wireless-carplay-aa/comp/4_audio/files/libev6aac\.so|ev/carplay/native/|ev/carplay/build\.sh|packages/wireless-carplay-aa/comp/2_tbt/files/)'
          out kits    '^(kits/|docs/downloads/|recipes/|tools/build-kit\.sh|tools/check-downloads\.sh|tools/lpatch/lpatch$)'
          out package '^(packages/|patches/|recipes/|tools/build-package\.sh|tools/lpatch/lpatch$|tools/lpatch/lpatch\.c|tools/compat-built\.py|docs/data/compat\.json|tools/test-universal\.sh|tools/test-cars\.sh|tools/mkuniversal\.py)'
          out ev      '^(ev/|packages/wireless-carplay-aa/(scripts/build\.sh|svc/)|tools/test-ev-select\.sh|tools/test-evlog-offload\.sh|tools/test-wifi-client-warn\.sh|tools/test-hotspot-firewall\.sh|tools/ev-check\.py|tools/test-ev-check\.sh|ev/car-reference)'

  build-lpatch:
    name: Build and Test Lpatch
    needs: changes
    if: needs.changes.outputs.lpatch == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pip dependencies
        run: |
          pip install --require-hashes -r tools/requirements.txt

      - name: Install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Test lpatch
        run: |
          ./tools/lpatch/test.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: lpatch
          path: ./tools/lpatch/

  verify-ev6aac:
    name: Verify libev6aac.so and the CarPlay EV libraries
    needs: changes
    if: needs.changes.outputs.ev6aac == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang 18 and lld 18
        # the toolchain the shipped libev6aac.so was built with (Ubuntu 24.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18

      - name: libev6aac.so rebuilds byte for byte from src/ev6aac
        run: |
          CLANG=clang-18 ./src/ev6aac/build.sh "$RUNNER_TEMP/libev6aac.so"
          shipped=packages/wireless-carplay-aa/comp/4_audio/files/libev6aac.so
          if cmp "$RUNNER_TEMP/libev6aac.so" "$shipped"; then
            echo "libev6aac.so matches its source"
          else
            echo "--- sections: name address offset size alignment (shipped | rebuilt):"
            paste <(readelf -SW "$shipped" | sed -n 's/^ *\[ *[0-9]*\] //p' | awk '{print $1, $3, $4, $5, $NF}') \
                  <(readelf -SW "$RUNNER_TEMP/libev6aac.so" | sed -n 's/^ *\[ *[0-9]*\] //p' | awk '{print $1, $3, $4, $5, $NF}')
            echo "--- strings that differ:"
            diff <(strings -n 4 "$shipped" | sort) <(strings -n 4 "$RUNNER_TEMP/libev6aac.so" | sort) || true
            clang-18 --version | head -1
            exit 1
          fi

      - name: CarPlay EV libraries rebuild byte for byte from ev/carplay
        run: |
          CLANG=clang-18 ./ev/carplay/build.sh "$RUNNER_TEMP/carplay"
          for f in libcarplayev.so libcarplayidentity.so; do
            cmp "$RUNNER_TEMP/carplay/$f" "packages/wireless-carplay-aa/comp/2_tbt/files/$f" || { clang-18 --version | head -1; exit 1; }
          done
          echo "CarPlay EV libraries match their source"

  build-kit:
    name: Build Kit
    needs: changes
    if: needs.changes.outputs.kits == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the Leafia kit
        run: |
          ./tools/build-kit.sh

      - name: Website kit downloads match kits/leafia
        run: |
          ./tools/check-downloads.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: leafia-kit
          path: ./dist/*.zip

  build-package:
    name: Build Wireless Carplay/AA Package
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build package
        run: |
          ./tools/build-package.sh

      - name: Compatibility page knows every installed build
        # docs/data/compat.json "built" must match the patch manifests (tools/compat-built.py)
        run: python3 tools/compat-built.py --check

      - name: Universal build (made-up apps, sh and mksh)
        run: |
          sudo apt-get install -y -qq mksh > /dev/null
          pip install --require-hashes -r tools/requirements.txt
          sh tools/test-universal.sh
          sh tools/test-universal.sh mksh
          sh tools/test-cars.sh
          sh tools/test-cars.sh mksh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: wireless-carplay-aa
          path: ./dist/*.zip

  test-ev:
    name: Test EV Features
    needs: changes
    if: needs.changes.outputs.ev == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mksh (the head unit's shell) and the Android 4.4 platform
        run: |
          sudo apt-get update
          sudo apt-get install -y mksh
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-19" > /dev/null

      - name: EV build selection (+ev manifest lines, EVERGREEN-NO-EV)
        run: |
          sh tools/test-ev-select.sh
          sh tools/test-ev-select.sh mksh

      - name: EV log copier service
        run: |
          sh tools/test-evlog-offload.sh
          sh tools/test-evlog-offload.sh mksh

      - name: EV fit check (kit report vs ev/car-reference)
        run: sh tools/test-ev-check.sh

      - name: Wi-Fi client warning service
        run: |
          sh tools/test-wifi-client-warn.sh
          sh tools/test-wifi-client-warn.sh mksh
          sh tools/test-hotspot-firewall.sh
          sh tools/test-hotspot-firewall.sh mksh

      - name: EV code on the JVM (preconditioning, log rows, capacity scaling)
        run: sh ev/gpm-ev/test/run.sh

      - name: EV log tool (check and clean)
        run: sh ev/tools/test_evlog.sh

  security:
    name: Secret Scan & ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck > /dev/null

      - name: Gitleaks secret scan
        run: |
          VER=8.30.1
          SHA=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tgz"
          echo "$SHA  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git --no-banner --redact .

      # Each tracked *.sh in its dialect: #!/system/bin/sh is the head unit's mksh (checked
      # as ksh), bash scripts as bash, the rest as sh.
      - name: ShellCheck
        run: |
          git ls-files '*.sh' ':!kits/leafia/*' | while IFS= read -r f; do
            case $(head -n 1 "$f") in
              '#!/system/bin/sh'*) echo "$f" >> "$RUNNER_TEMP/sc-ksh" ;;
              '#!'*bash*) echo "$f" >> "$RUNNER_TEMP/sc-bash" ;;
              *) echo "$f" >> "$RUNNER_TEMP/sc-sh" ;;
            esac
          done
          for d in sh ksh bash; do
            [ ! -s "$RUNNER_TEMP/sc-$d" ] || tr '\n' '\0' < "$RUNNER_TEMP/sc-$d" | xargs -0 shellcheck -S warning -s "$d"
          done

      # kits/leafia is published byte for byte as the website's downloads (tools/check-downloads.sh),
      # so its findings are reported here and fixed when the kit next changes.
      - name: ShellCheck (kits/leafia, report only)
        continue-on-error: true
        run: git ls-files -z 'kits/leafia/*.sh' | xargs -0 shellcheck -S warning -s ksh
